<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8a7642">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tasva LFW">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238a7642'/%3E%3Ctext x='32' y='43' font-family='Georgia' font-size='30' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
<title>Tasva LFW Show Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Jost:wght@400;500;600&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: sticky brand bar + tab rail, one working surface per tab; drawer slides in from the right for record detail. Palette lifted from the Tasva invite: bronze-gold on paper white. */
:root{
  --bg:#f3f3ee; --surface:#ffffff; --surface-2:#f8f7f2; --ink:#24221b; --muted:#6c6757; --line:#e1ded2; --line-strong:#cdc8b6;
  --gold:#8a7642; --gold-ink:#6b5a2c; --gold-soft:#efe9d6; --on-gold:#ffffff;
  --ok:#2c7149; --ok-soft:#e3f1e8; --warn:#9a600d; --warn-soft:#fbefd9; --bad:#ab3434; --bad-soft:#f8e3e1;
  --info:#355b8c; --info-soft:#e3ebf6; --violet:#68479c; --violet-soft:#ece5f6; --teal:#22706e; --teal-soft:#dff0ee;
  --rose:#a23d6b; --rose-soft:#f6e2eb; --slate:#5d6470; --slate-soft:#e9eaec;
  --shadow:0 12px 40px rgba(40,34,18,.14);
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Jost","Futura","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:10px; --r-sm:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14130f; --surface:#1d1b16; --surface-2:#22201a; --ink:#ebe7da; --muted:#a39d8a; --line:#322f27; --line-strong:#47433a;
  --gold:#c8b27a; --gold-ink:#dcc894; --gold-soft:#2d2918; --on-gold:#1a1810;
  --ok:#6cc292; --ok-soft:#1b2e22; --warn:#e2a64c; --warn-soft:#33270f; --bad:#ec8a84; --bad-soft:#3a1d1b;
  --info:#8fb4e6; --info-soft:#1b2638; --violet:#bba2ea; --violet-soft:#2a2238; --teal:#7ed0cc; --teal-soft:#16302f;
  --rose:#eb93bb; --rose-soft:#36202b; --slate:#aab1bc; --slate-soft:#272a2f;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14130f; --surface:#1d1b16; --surface-2:#22201a; --ink:#ebe7da; --muted:#a39d8a; --line:#322f27; --line-strong:#47433a;
  --gold:#c8b27a; --gold-ink:#dcc894; --gold-soft:#2d2918; --on-gold:#1a1810;
  --ok:#6cc292; --ok-soft:#1b2e22; --warn:#e2a64c; --warn-soft:#33270f; --bad:#ec8a84; --bad-soft:#3a1d1b;
  --info:#8fb4e6; --info-soft:#1b2638; --violet:#bba2ea; --violet-soft:#2a2238; --teal:#7ed0cc; --teal-soft:#16302f;
  --rose:#eb93bb; --rose-soft:#36202b; --slate:#aab1bc; --slate-soft:#272a2f;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold-ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num,td.n,.tab-nums{font-variant-numeric:tabular-nums}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:1320px;margin:0 auto;padding-inline:16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:12px 0}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:600;letter-spacing:.18em;font-size:20px;color:var(--gold-ink)}
.brand span{color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.countdown{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.countdown strong{font-family:var(--f-display);font-size:20px;color:var(--ink);font-weight:600}
.me{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.me img{width:24px;height:24px;border-radius:50%}
.tabs{flex-basis:100%;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:4px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;color:var(--muted);white-space:nowrap;font-weight:500;display:flex;align-items:center;gap:6px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tabs button:hover{color:var(--ink)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--gold);color:var(--on-gold);font-size:12px;font-weight:600}

main{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:20px 80px}
.banner{padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);margin-bottom:16px}
h1,h2,h3{text-wrap:balance;margin:0}
h2.sec{font-family:var(--f-display);font-weight:600;font-size:26px;margin-bottom:4px}
.sub{color:var(--muted);margin:0 0 16px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:16px}
.g-tiles{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.grid > *,.stack > *{min-width:0}
.tile{padding:14px 16px}
.tile .v{font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1.1;margin-top:6px}
.tile .v small{font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:400}
.tile .s{color:var(--muted);font-size:13px;margin-top:4px}
.meter{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:flex;margin-top:10px}
.meter i{display:block;height:100%}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);padding:7px 12px;border-radius:var(--r-sm);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=datetime-local],input[type=url],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:7px 10px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);letter-spacing:.02em}
label.f input,label.f select,label.f textarea{font-size:14px;color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1 1 220px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;cursor:pointer;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold-ink);font-weight:600}
.seg.av button[aria-pressed="true"][data-v="yes"]{background:var(--ok-soft);color:var(--ok)}
.seg.av button[aria-pressed="true"][data-v="no"]{background:var(--bad-soft);color:var(--bad)}
.seg.av button[aria-pressed="true"][data-v="pending"]{background:var(--slate-soft);color:var(--slate)}

/* Chips & pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--slate-soft);color:var(--slate)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.c-slate{background:var(--slate-soft);color:var(--slate)} .c-blue{background:var(--info-soft);color:var(--info)}
.c-violet{background:var(--violet-soft);color:var(--violet)} .c-amber{background:var(--warn-soft);color:var(--warn)}
.c-green{background:var(--ok-soft);color:var(--ok)} .c-rose{background:var(--rose-soft);color:var(--rose)}
.c-teal{background:var(--teal-soft);color:var(--teal)} .c-red{background:var(--bad-soft);color:var(--bad)}
.c-gold{background:var(--gold-soft);color:var(--gold-ink)}
.flags{display:flex;flex-wrap:wrap;gap:4px}
.flag{font-size:11px;padding:1px 7px;border-radius:4px;white-space:nowrap}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink);font-weight:500}
.chip .x{margin-left:4px;opacity:.6}
select.status{border-radius:999px;padding:3px 8px;font-size:12px;font-weight:500;border:1px solid transparent;cursor:pointer;max-width:200px}

/* Table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--surface-2);position:sticky;top:0;white-space:nowrap}
th.n,td.n{text-align:right}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td .who{display:flex;align-items:center;gap:10px;min-width:180px}
.namebtn{background:none;border:0;padding:0;cursor:pointer;font-weight:600;text-align:left;color:var(--ink)}
.namebtn:hover{color:var(--gold-ink);text-decoration:underline}
.handle{font-size:12px;color:var(--muted);text-decoration:none;display:block}
.handle:hover{color:var(--gold-ink)}
.mono{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold-ink);font-family:var(--f-display);font-weight:600;font-size:14px;overflow:hidden}
.mono img{width:100%;height:100%;object-fit:cover}
.delta-up{color:var(--warn)} .delta-down{color:var(--ok)}
.avdots{display:inline-flex;gap:3px}
.avdots i{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:600}
.av-yes{background:var(--ok-soft);color:var(--ok)} .av-no{background:var(--bad-soft);color:var(--bad)} .av-pending{background:var(--slate-soft);color:var(--slate)}
.footer-sum{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:10px;box-shadow:0 -6px 20px rgba(0,0,0,.04)}
.footer-sum b{font-family:var(--f-display);font-size:18px}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0}
.card:hover{border-color:var(--gold)}
.card .ph{aspect-ratio:4/5;max-width:100%;background:var(--gold-soft);display:grid;place-items:center;color:var(--gold-ink);font-family:var(--f-display);font-size:44px;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .bd{padding:10px 12px;display:grid;gap:6px}
.card .nm{font-weight:600}
.card .rw{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;color:var(--muted)}

/* Dashboard */
.funnel{display:grid;gap:8px}
.frow{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;font-size:14px}
.fbar{height:22px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.fbar i{display:block;height:100%;border-radius:4px}
.actions-list{display:grid}
.act{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.act:last-child{border-bottom:0}
.act:hover{background:var(--surface-2)}
.act .cnt{font-family:var(--f-display);font-size:22px;font-weight:600;min-width:44px;text-align:right}
.act .lbl{flex:1;min-width:0}
.act .lbl small{display:block;color:var(--muted);font-size:12px}
.act .stripe{width:4px;align-self:stretch;border-radius:2px}
.act.zero{opacity:.5}
.matrix td,.matrix th{padding:7px 8px}
.matrix td.n b{font-weight:600}
.nodata{padding:30px 16px;text-align:center;color:var(--muted)}

/* Approvals */
.queues{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.queue h3{font-family:var(--f-display);font-size:22px;font-weight:600;display:flex;align-items:center;gap:10px}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px}
.acard{display:grid;grid-template-columns:auto auto 1fr;gap:10px 12px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:8px}
.acard .meta{font-size:13px;color:var(--muted)}
.acard .btns{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.acard .btns input{flex:1 1 160px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(20,18,12,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.dh{padding:16px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.dh .mono{width:64px;height:64px;font-size:24px;border-radius:12px}
.dh h3{font-family:var(--f-display);font-size:24px;font-weight:600}
.db{overflow-y:auto;padding:16px;display:grid;gap:14px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.dsec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.dsec h4{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.avrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.avrow small{color:var(--muted);display:block}
.trail{font-size:13px;color:var(--muted);display:grid;gap:3px}
.trail b{color:var(--ink);font-weight:500}
.log{font-size:13px;display:grid;gap:6px}
.log div{display:flex;gap:8px}
.log time{color:var(--muted);white-space:nowrap;min-width:92px}

/* Agency desk / import / settings */
.desk{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));align-items:start}
.msg{font-family:var(--f-body);font-size:14px;line-height:1.5;min-height:360px;background:var(--surface-2)}
.srclist{display:grid;gap:6px}
.srcbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;text-align:left}
.srcbtn[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.srcbtn small{color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.st-row{display:grid;grid-template-columns:auto minmax(0,1fr) 150px 110px auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.st-row:last-child{border-bottom:0}
.st-row .mv{display:flex;gap:2px}
@media (max-width:640px){
  .st-row{grid-template-columns:minmax(0,1fr) auto;}
  .st-row > .sw{display:none}
  .frow{grid-template-columns:110px 1fr 40px}
  .countdown{margin-left:0}
  .footer-sum .bulk{margin-left:0}
}
/* Modal, popover, dashboard details, change feed */
.modal-scrim{position:fixed;inset:0;background:rgba(20,18,12,.45);z-index:70;display:grid;place-items:center;padding:16px}
.modal{background:var(--bg);border-radius:var(--r);box-shadow:var(--shadow);width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal.sm{width:min(440px,100%)}
.modal header{padding:16px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.modal header h3{font-family:var(--f-display);font-size:22px;font-weight:600}
.modal .mb{padding:16px 18px;overflow-y:auto;display:grid;gap:14px}
.modal footer{padding:12px 18px;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.modal footer .err{color:var(--bad);font-size:13px;margin-right:auto}
.req::after{content:" *";color:var(--bad)}
.pop{position:fixed;z-index:65;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);box-shadow:var(--shadow);padding:8px;display:grid;gap:2px;min-width:230px}
.pop label{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:var(--r-sm);cursor:pointer;font-size:14px}
.pop label:hover{background:var(--surface-2)}
.pop small{color:var(--muted);display:block;font-size:12px}
.avbtn{display:inline-flex;gap:3px;align-items:center;background:none;border:1px solid transparent;border-radius:6px;padding:2px 4px;cursor:pointer}
.avbtn:hover{border-color:var(--line-strong)}
.avbtn .car{color:var(--muted);font-size:10px;margin-left:2px}
select.meas{border-radius:999px;padding:3px 8px;font-size:12px;font-weight:500;border:1px solid transparent;cursor:pointer}
.act-wrap{border-bottom:1px solid var(--line)}
.act-wrap:last-child{border-bottom:0}
.act-wrap .act{border-bottom:0}
.act .det{flex:none}
.detail{padding:4px 0 12px 64px;display:grid;gap:4px}
.detail .di{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:14px}
.detail .di .muted{font-size:13px}
.feed{display:grid;gap:0}
.feed .fi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.feed .fi:last-child{border-bottom:0}
.feed .who-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff}
.feed time{color:var(--muted);font-size:12px}
.lastby{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:10px}
.lastby .lb{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;font-size:14px}
.lastby .lb b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r-sm);z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.diff{font-size:13px}
.diff td{vertical-align:top}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:grid;gap:12px}

.tabs .ic{display:none}

  input,select,textarea{font-size:16px!important}

  .tabs button[aria-selected="true"]{border-top-color:var(--gold);color:var(--gold-ink)}
  .tabs .ic{display:block;width:22px;height:22px}
  .tabs .lbl{white-space:nowrap}

  main{padding-block:14px calc(92px + env(safe-area-inset-bottom,0px))}

  h2.sec{font-size:23px}

  .toolbar input[type=search]{flex:1 1 100%}
  .toolbar .filters{display:none;flex-wrap:wrap;gap:8px;width:100%}

  .toolbar .filters select{flex:1 1 calc(50% - 4px);min-width:0}
  .ftoggle{display:inline-flex}
  .btn{min-height:40px}
  .btn.sm{min-height:34px}
  .tile .v{font-size:28px}
  .g-tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{padding:12px}
  .drawer{width:100%}
  .dh{padding:12px 14px}
  .dh .mono{width:52px;height:52px}
  .db{padding:12px}
  .modal-scrim{align-items:end;padding:0}
  .modal,.modal.sm{width:100%!important;max-height:92vh;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .modal footer{justify-content:stretch}

  .queues{grid-template-columns:1fr}
  .acard{grid-template-columns:auto 1fr}
  .acard > .acheck{display:none}

}

<script type="module">
const V="10.12.2", base=`https://www.gstatic.com/firebasejs/${V}/`;
try{
  let cfg; try{ cfg=(await import("./firebase-config.js")).default; }catch(e){ cfg=null; }
  if(!cfg||!cfg.apiKey||/PASTE/i.test(cfg.apiKey)||!cfg.projectId||/PASTE/i.test(cfg.projectId)) throw new Error("config");
  const [app,fs,au]=await Promise.all([import(base+"firebase-app.js"),import(base+"firebase-firestore.js"),import(base+"firebase-auth.js")]);
  const fa=app.initializeApp(cfg);
  const db=fs.initializeFirestore(fa,{ignoreUndefinedProperties:true});
  const wrapDoc=s=>({id:s.id,exists:s.exists(),data:()=>s.data(),metadata:s.metadata});
  const wrapQ=s=>({docs:s.docs.map(wrapDoc),size:s.size,empty:s.empty});
  const flatten=(o,p="",out={})=>{ for(const [k,v] of Object.entries(o)){ const key=p?p+"."+k:k;
    if(v&&typeof v==="object"&&!Array.isArray(v)&&Object.keys(v).length) flatten(v,key,out); else out[key]=v; } return out; };
  const err=e=>{ const code=(e&&e.code||"").replace("permission-denied","permission_denied"); return Object.assign(new Error(e&&e.message||"error"),{code}); };
  const wrapP=p=>p.catch(e=>{ throw err(e); });
  function docRef(path){ const r=fs.doc(db,path); return {
    id:r.id, path,
    get:async()=>wrapDoc(await fs.getDoc(r)),
    set:d=>wrapP(fs.setDoc(r,d)), update:d=>wrapP(fs.updateDoc(r,flatten(d))), delete:()=>wrapP(fs.deleteDoc(r)),
    onSnapshot:(n,e)=>fs.onSnapshot(r,s=>n(wrapDoc(s)),x=>e&&e(err(x))) }; }
  function queryRef(path,cons=[]){ const c=fs.collection(db,path); return {
    path,
    where:(f,op,v)=>queryRef(path,[...cons,fs.where(f,op,v)]),
    orderBy:(f,d)=>queryRef(path,[...cons,fs.orderBy(f,d||"asc")]),
    limit:n=>queryRef(path,[...cons,fs.limit(n)]),
    get:async()=>wrapQ(await fs.getDocs(fs.query(c,...cons))),
    onSnapshot:(n,e)=>fs.onSnapshot(fs.query(c,...cons),s=>n(wrapQ(s)),x=>e&&e(err(x))),
    doc:id=>docRef(path+"/"+(id||fs.doc(c).id)),
    add:async d=>{ const r=await wrapP(fs.addDoc(c,d)); return docRef(path+"/"+r.id); } }; }
  const adapter={ collection:p=>queryRef(p), doc:p=>docRef(p),
    batchSet:async(items,onProgress)=>{ for(let i=0;i<items.length;i+=400){ const b=fs.writeBatch(db);
      items.slice(i,i+400).forEach(([p,d])=>b.set(fs.doc(db,p),d)); await wrapP(b.commit()); onProgress&&onProgress(Math.min(items.length,i+400)); } } };
  const auth=au.getAuth(fa);
  try{ await au.getRedirectResult(auth); }catch(e){ console.warn(e); }
  const authApi={
    onChange:cb=>au.onAuthStateChanged(auth,u=>cb(u?{uid:u.uid,email:(u.email||"").toLowerCase(),name:u.displayName||"",photo:u.photoURL||"",verified:!!u.emailVerified}:null)),
    signIn:async()=>{ const p=new au.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
      try{ await au.signInWithPopup(auth,p); }
      catch(e){ if(/popup-blocked|operation-not-supported|popup-closed-by-browser/.test(e.code||"")) await au.signInWithRedirect(auth,p); else if(!/popup-closed-by-user|cancelled-popup-request/.test(e.code||"")) throw e; } },
    signOut:()=>au.signOut(auth) };
  window.__fbResolve({db:adapter,auth:authApi});
}catch(e){ console.error(e); window.__fbResolve(e&&e.message==="config"?{setup:true}:{error:String(e&&e.message||e)}); }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
/* ---------- Defaults ---------- */
const SYS = ["new","pending_piyush","waiting_agency","confirmed","dropped"];
const BUCKETS = [
  {id:"review",  label:"Ankita to review", color:"blue"},
  {id:"internal",label:"With Piyush",       color:"violet"},
  {id:"agency",  label:"With agency",       color:"amber"},
  {id:"confirmed",label:"Confirmed",        color:"green"},
  {id:"out",     label:"Dropped",           color:"slate"}
];
const COLORS = ["slate","blue","violet","amber","green","teal","rose","red","gold"];
const baseStatuses = () => ([
  {id:"new",label:"New · Ankita to review",bucket:"review",color:"blue"},
  {id:"pending_piyush",label:"Approval pending Piyush",bucket:"internal",color:"violet"},
  {id:"waiting_agency",label:"Waiting on agency",bucket:"agency",color:"amber"},
  {id:"counter",label:"Counter-offer pending",bucket:"agency",color:"rose"},
  {id:"confirmed",label:"Confirmed",bucket:"confirmed",color:"green"},
  {id:"dropped",label:"Dropped",bucket:"out",color:"slate"}
]);
const DEFAULT_CONFIG = {
  statuses:{models:baseStatuses(), influencers:baseStatuses()},
  markers:{
    models:[{id:"look_test",label:"Look test done"},{id:"design_ok",label:"Selected by design"},{id:"outstation",label:"Needs flight / stay"},{id:"adv_req",label:"Advance required"},{id:"adv_paid",label:"Advance paid"}],
    influencers:[{id:"selected",label:"Selected"},{id:"not_selected",label:"Not selected"},{id:"posting",label:"Posting committed"},{id:"adv_req",label:"Advance required"},{id:"adv_paid",label:"Advance paid"}]
  },
  sources:{models:["TSS","Udit Runway","Purple Thoughts","Amit","Lakme","Individual"], influencers:["Apostrophe","Debarathi"]},
  dates:{ho:"", taj:"2026-10-11", show:"2026-10-15T21:30"},
  targets:{models:80, reach:25000000},
  hikePct:20
};
const KINDS = {
  models:{coll:"models", one:"model", label:"Models"},
  influencers:{coll:"influencers", one:"influencer", label:"Influencers"}
};
const MEAS = [["height","Height"],["chest","Chest"],["waist","Waist"],["hips","Hips"],["shoulder","Shoulder"],["sleeve","Sleeve"],["inseam","Inseam"],["shoe","Shoe"]];
const ALTER = ["Not started","In progress","Done"];
const TABS = [["dashboard","Dashboard"],["models","Models"],["influencers","Influencers"],["approvals","Approvals"],["desk","Agency desk"],["import","Excel sync"],["settings","Settings"]];

/* ---------- State ---------- */
const S = {
  db:null, auth:null, authUser:null, role:"guest", roles:null, downloads:null, bootMsg:"",
  models:[], influencers:[], config:clone(DEFAULT_CONFIG), configExists:false, activity:[], profiles:{},
  loaded:{models:false, influencers:false, config:false},
  tab:"dashboard",
  f:{models:{q:"",source:"all",bucket:"all",status:"all",flag:"all",sort:"serial",view:"table"},
     influencers:{q:"",source:"all",bucket:"all",status:"all",flag:"all",sort:"name",view:"table",type:"all"}},
  sel:{models:new Set(), influencers:new Set(), approvals:new Set()},
  drawer:null, confirmDelete:false,
  desk:{source:null, sec:{book:true, avail:true, meas:true}},
  imp:null, dirty:false, sync:{models:null,influencers:null}, syncIn:null, copy:null, restore:"", ready:false
};

/* ---------- Utils ---------- */
function clone(o){return JSON.parse(JSON.stringify(o))}
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nowISO = ()=>new Date().toISOString();
const inr = n => n==null||n===""?"—":"₹"+Number(n).toLocaleString("en-IN");
const inrShort = n => n>=1e7?"₹"+(n/1e7).toFixed(2)+" Cr":n>=1e5?"₹"+(n/1e5).toFixed(2)+" L":inr(n);
const fmtF = n => !n?"0":n>=1e6?(n/1e6).toFixed(n>=1e8?0:1).replace(/\.0$/,"")+"M":n>=1e3?Math.round(n/1e3)+"K":String(n);
function parseNum(s){
  if(typeof s==="number") return isFinite(s)?Math.round(s):null;
  s=String(s??"").trim().toLowerCase().replace(/[,₹\s]/g,"").replace(/^rs\.?/,"");
  const m=s.match(/^(\d+(?:\.\d+)?)(k|l|lac|lakh|m|mn|cr)?$/); if(!m) return null;
  let n=parseFloat(m[1]); const u=m[2];
  if(u==="k") n*=1e3; else if(u==="l"||u==="lac"||u==="lakh") n*=1e5; else if(u==="m"||u==="mn") n*=1e6; else if(u==="cr") n*=1e7;
  return Math.round(n);
}
const normKey = s => String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const slug = s => String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80)||"x";
function normSource(kind,s){
  const k=normKey(s);
  if(kind==="models"){
    if(!k) return "Individual";
    if(k.includes("udit")||k.includes("runway")) return "Udit Runway";
    if(k.includes("purple")) return "Purple Thoughts";
    if(k==="tss") return "TSS";
    if(k.includes("amit")) return "Amit";
    if(k.includes("lakme")) return "Lakme";
    if(k.includes("individual")||k.includes("freelance")||k.includes("direct")) return "Individual";
  } else {
    if(k.includes("apostrophe")) return "Apostrophe";
    if(k.includes("debarathi")||k.includes("debarati")) return "Debarathi";
  }
  const hit=(S.config.sources[kind]||[]).find(x=>normKey(x)===k);
  return hit||String(s).trim();
}
function mapStatus(raw){
  const k=String(raw||"").toLowerCase();
  if(!k.trim()) return "new";
  if(k.includes("counter")) return "counter";
  if(k.includes("piyush")) return "pending_piyush";
  if(k.includes("reject")||k.includes("drop")||k.includes("not selected")) return "dropped";
  if(k.includes("awaiting")||k.includes("pending")) return "waiting_agency";
  if(k.includes("lakme")||k.includes("confirmed")) return "confirmed";
  return "new";
}
function handleOf(url){
  if(!url) return "";
  const m=String(url).match(/instagram\.com\/([^/?#]+)/i);
  return m?"@"+m[1]:String(url).replace(/^https?:\/\//,"").slice(0,32);
}
function initials(n){return String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase()}
function fmtDate(d,opt){ if(!d) return "date TBC"; const x=new Date(d.length<=10?d+"T00:00":d); if(isNaN(x)) return d; return x.toLocaleDateString("en-IN",opt||{day:"numeric",month:"short"}); }
function fmtWhen(iso){ if(!iso) return ""; const d=new Date(iso); return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"}); }
function toast(msg){ const r=$("#toast-root"); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>r.innerHTML="",2600); }

/* ---------- Roles & permissions ---------- */
const PEOPLE={ankita:{name:"Ankita",color:"#8a7642"},piyush:{name:"Piyush",color:"#68479c"}};
function can(a){ const r=S.role;
  if(a==="edit") return r==="ankita"||r==="piyush";
  if(["settings","sync","delete","restore"].includes(a)) return r==="ankita";
  return false; }
function canSetStatus(from,to){ const r=S.role; if(!can("edit")) return false; if(from===to) return true;
  if(to==="pending_piyush") return r==="ankita";
  if(from==="new") return r==="ankita";
  if(from==="pending_piyush") return r==="piyush"||(r==="ankita"&&(to==="new"||to==="dropped"));
  return true; }
const canApprove = r => (r.status==="new"&&S.role==="ankita")||(r.status==="pending_piyush"&&S.role==="piyush");
const canReject = r => canApprove(r)||(S.role==="ankita"&&r.status==="pending_piyush");
const whoseTurn = r => r.status==="new"?"Waiting for Ankita":r.status==="pending_piyush"?"Waiting for Piyush":"";
const isPhone = () => window.matchMedia("(max-width: 640px)").matches;
const VIEW_ONLY_MSG="View only. Sign in as Ankita or Piyush to make changes.";
async function saveFile({filename,data}){
  const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));
  const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000); return {status:"saved"}; }

/* ---------- Domain helpers ---------- */
const recs = kind => S[kind];
const rec = (kind,id) => S[kind].find(r=>r.id===id);
const statuses = kind => S.config.statuses[kind];
function statusOf(kind,id){ return statuses(kind).find(s=>s.id===id) || {id, label:id||"New", bucket:"review", color:"slate"}; }
const bucketOf = (kind,r) => statusOf(kind,r.status).bucket;
const effFee = r => r.finalFee ?? r.counter ?? r.proposal ?? null;
const measDone = r => r.measStatus==="done";
/* Availability: H / T / S. A ticked date means the person is confirmed for it. */
function availKeys(){
  const d=S.config.dates;
  return [["ho","H","Head office fitting",d.ho],["taj","T","Taj fitting",d.taj],["show","S","Show",d.show]];
}
const isAv = (r,k) => r.avail?.[k]==="yes";
function flagsOf(kind,r){
  const b=bucketOf(kind,r), out=[];
  if(b==="out") return out;
  const ef=effFee(r);
  if(!r.insta&&!r.photo) out.push({k:"link",label:r.linkNote==="TBD"?"Link TBD":"No Instagram",c:"c-slate"});
  if(ef==null) out.push({k:"fee",label:"Fee unknown",c:"c-amber"});
  if(b==="confirmed"&&r.finalFee==null) out.push({k:"nofinal",label:"Final fee not set",c:"c-blue"});
  if(b==="confirmed"&&!measDone(r)) out.push({k:"nomeas",label:"Measurement not done",c:"c-violet",hide:true});
  if(b==="confirmed"&&!isAv(r,"show")) out.push({k:"shownot",label:"Show not confirmed",c:"c-red"});
  if(b==="confirmed"&&availKeys().some(([k])=>!isAv(r,k))) out.push({k:"availpending",label:"Availability pending",c:"c-slate",hide:true});
  if(r.fee2025&&ef&&ef>r.fee2025*(1+S.config.hikePct/100)) out.push({k:"hike",label:"+"+Math.round((ef/r.fee2025-1)*100)+"% vs 2025",c:"c-amber"});
  return out;
}
const FLAG_FILTERS = [["link","No Instagram link"],["fee","Fee unknown"],["nofinal","Final fee not set"],["nomeas","Measurement not done"],["shownot","Show day not confirmed"],["availpending","Availability pending"],["hike","Fee hike vs 2025"],["ready","Show-ready"]];
function isReady(kind,r){ return bucketOf(kind,r)==="confirmed" && isAv(r,"show") && measDone(r) && r.alteration==="Done"; }

/* ---------- DB writes ---------- */
const chains={};
function queue(path,fn){ const p=(chains[path]||Promise.resolve()).then(fn); chains[path]=p.catch(()=>{}); return p; }
function dbErr(e){
  console.error(e);
  const c=e&&e.code;
  if(c==="permission_denied"||c==="invalid_argument") toast("Not allowed for your role. Only Ankita gives the first approval and only Piyush the final one; Settings and Excel sync are Ankita's.");
  else if(e&&/view-only|offline/.test(e.message||"")) return;
  else if(c==="quota_exceeded") toast("The tracker's storage is full. Delete old activity or records.");
  else toast("Couldn't save. Check your connection and try again.");
}
async function patchRec(kind,id,patch,logText){
  if(!S.db) { toast("The tracker isn't connected. Check your internet and reload."); throw new Error("offline"); }
  if(!can("edit")) { toast(VIEW_ONLY_MSG); throw new Error("view-only"); }
  const r=rec(kind,id);
  patch.updatedAt=nowISO(); patch.updatedBy=S.role; patch=clone(patch);
  try{
    await queue(KINDS[kind].coll+"/"+id, ()=>S.db.collection(KINDS[kind].coll).doc(id).update(patch));
    if(logText) logAct(kind,id,r?r.name:"",logText);
  }catch(e){ dbErr(e); throw e; }
}
async function createRec(kind,id,data,logText){
  if(!can("edit")) { toast(VIEW_ONLY_MSG); throw new Error("view-only"); }
  data.createdAt=data.createdAt||nowISO(); data.updatedAt=nowISO(); data.updatedBy=S.role; data=clone(data);
  await queue(KINDS[kind].coll+"/"+id, ()=>S.db.collection(KINDS[kind].coll).doc(id).set(data));
  if(logText) logAct(kind,id,data.name,logText);
}
function logAct(kind,recId,recName,text){
  if(!S.db) return;
  S.db.collection("activity").add({at:nowISO(), by:S.role, kind, recId, recName:recName||"", text}).catch(e=>console.warn("log",e));
}
async function saveConfig(){
  if(!S.db) return;
  if(!can("settings")) return toast("Only Ankita can change settings.");
  try{ await queue("config/main",()=>S.db.doc("config/main").set(S.config)); }catch(e){ dbErr(e); }
}
function newRecord(kind,o){
  const base={serial:null,name:"",source:"",insta:"",linkNote:"",nextAction:"",fee2025:null,proposal:null,feeNote:"",counter:null,finalFee:null,
    status:"new",markers:[],avail:{ho:"pending",taj:"pending",show:"pending"},meas:{},measStatus:"not_done",alteration:"Not started",notes:"",approvals:{},origin:"app"};
  if(kind==="influencers") Object.assign(base,{type:"walking",followers:null});
  return Object.assign(base,o);
}
function uniqueId(kind,name,source){
  let id=slug(name)+"--"+slug(source), i=2;
  while(rec(kind,id)) id=slug(name)+"--"+slug(source)+"-"+(i++);
  return id;
}

/* ---------- Modal ---------- */
let modalDone=null;
function openModal(html,cls=""){
  $("#modal-root").innerHTML=`<div class="modal-scrim" data-action="modal-scrim"><div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
  const f=$("#modal-root [data-autofocus]")||$("#modal-root .modal button.primary, #modal-root .modal button.ok"); f&&f.focus();
}

      <footer><button class="btn" data-action="modal-no">Cancel</button><button class="btn ${okClass}" data-action="modal-yes">${esc(ok)}</button></footer>`,"sm"); });

function approveText(r){ return r.status==="new"?"It moves to <b>Approval pending Piyush</b>.":"Piyush's approval is recorded and it moves to <b>Waiting on agency</b> so the booking can go out."; }
async function askApprove(kind,id){
  const r=rec(kind,id); if(!r) return false;
  const ok=await confirmBox({title:"Approve "+r.name+"?",body:`<p style="margin:0">Are you sure you want to approve <b>${esc(r.name)}</b> (${esc(r.source)}, ${inr(effFee(r))})? ${approveText(r)}</p>`,ok:"Yes, approve",okClass:"ok"});
  if(ok){ await approve(kind,id); toast(r.name+" approved"); }
  return ok;
}
async function askReject(kind,id,reason){
  const r=rec(kind,id); if(!r) return false;
  const ok=await confirmBox({title:"Reject "+r.name+"?",body:`<p style="margin:0">${esc(r.name)} will move to <b>Dropped</b>.${reason?` Reason: “${esc(reason)}”.`:""} You can bring them back later by changing the status.</p>`,ok:"Yes, reject",okClass:"danger"});
  if(ok){ await reject(kind,id,reason); toast(r.name+" moved to Dropped"); }
  return ok;
}
async function askBulkApprove(items){
  if(!items.length) return toast("None of the selected are waiting for approval");
  const names=items.map(([k,id])=>rec(k,id)?.name).filter(Boolean);
  const ok=await confirmBox({title:`Approve ${items.length} ${items.length===1?"person":"people"}?`,body:`<p style="margin:0 0 8px">Are you sure you want to approve:</p><p style="margin:0" class="muted">${names.map(esc).join(", ")}</p>`,ok:`Yes, approve ${items.length}`,okClass:"ok"});
  if(!ok) return false;
  for(const [k,id] of items) await approve(k,id).catch(()=>{});
  toast(`Approved ${items.length}`); return true;
}

/* ---------- Approvals ---------- */
async function approve(kind,id){
  const r=rec(kind,id); if(!r) return;
  if(!canApprove(r)) return toast(r.status==="new"?"Only Ankita can give the first approval.":"Only Piyush can give the final approval.");
  const stamp={by:S.role, at:nowISO(), via:"app"};
  if(r.status==="new") await patchRec(kind,id,{status:"pending_piyush",approvals:{ankita:stamp}},"Approved at Ankita's review → Approval pending Piyush");
  else if(r.status==="pending_piyush") await patchRec(kind,id,{status:"waiting_agency",approvals:{piyush:stamp}},"Approved by Piyush → booking request to agency");
}
async function reject(kind,id,reason){
  const r=rec(kind,id); if(!r) return;
  if(!canReject(r)) return toast("You can't reject at this stage.");
  const stage=S.role==="piyush"?"piyush":"ankita";
  await patchRec(kind,id,{status:"dropped",dropReason:reason||"",approvals:{[stage]:{by:S.role,at:nowISO(),rejected:true,via:"app"}}},"Rejected"+(stage==="piyush"?" at Piyush's approval":" at Ankita's review")+(reason?": "+reason:""));
}

function filtered(kind){
  const f=S.f[kind], q=f.q.trim().toLowerCase();
  let rs=recs(kind).filter(r=>{
    if(q&&!(String(r.name).toLowerCase().includes(q)||String(r.insta||"").toLowerCase().includes(q))) return false;
    if(f.source!=="all"&&r.source!==f.source) return false;
    if(f.bucket!=="all"&&bucketOf(kind,r)!==f.bucket) return false;
    if(f.status!=="all"&&r.status!==f.status) return false;
    if(f.type&&f.type!=="all"&&(r.type||"walking")!==f.type) return false;
    if(f.flag!=="all"){
      if(f.flag.startsWith("m:")){ if(!(r.markers||[]).includes(f.flag.slice(2))) return false; }
      else if(f.flag==="ready"){ if(!isReady(kind,r)) return false; }
      else if(!flagsOf(kind,r).some(x=>x.k===f.flag)) return false;
    }
    return true;
  });
  const order=s=>statuses(kind).findIndex(x=>x.id===s);
  const cmp={serial:(a,b)=>(a.serial??9999)-(b.serial??9999)||String(a.name).localeCompare(b.name),
    name:(a,b)=>String(a.name).localeCompare(b.name),
    status:(a,b)=>order(a.status)-order(b.status)||String(a.name).localeCompare(b.name),
    fee:(a,b)=>(effFee(b)||0)-(effFee(a)||0),
    followers:(a,b)=>(b.followers||0)-(a.followers||0),
    updated:(a,b)=>String(b.updatedAt||"").localeCompare(String(a.updatedAt||""))}[f.sort]||(()=>0);
  return rs.sort(cmp);
}

async function saveNew(kind,btn){
  const v=id=>($("#"+id)?.value||"").trim(), err=m=>{ $("#nw-err").textContent=m; };
  const name=v("nw-name"); if(!name) return err("Enter a name.");
  const source=v("nw-src");
  if(recs(kind).some(r=>normKey(r.name)===normKey(name)&&r.source===source)) return err(`${name} from ${source} is already in the list.`);
  const nums={}; for(const [id,key] of [["nw-fee25","fee2025"],["nw-prop","proposal"],["nw-final","finalFee"],["nw-fol","followers"]]){ const raw=v(id); if(!raw) continue; const n=parseNum(raw); if(n==null) return err(`"${raw}" isn't a number. Try 18000 or 18k.`); nums[key]=n; }
  let insta=v("nw-insta"); if(insta) insta=/^https?:\/\//i.test(insta)?insta:insta.startsWith("@")?"https://www.instagram.com/"+insta.slice(1):"https://"+insta;
  const note=v("nw-feenote");
  const o=Object.assign({name,source,insta,feeNote:note,counter:/^(ok|tbc)$/i.test(note)?null:parseNum(note),nextAction:v("nw-next"),status:v("nw-status"),measStatus:v("nw-meas"),
    serial:Math.max(0,...recs(kind).map(r=>r.serial||0))+1},nums);
  if(kind==="influencers") o.type=v("nw-type");
  const rec0=newRecord(kind,o);
  availKeys().forEach(([k])=>{ rec0.avail[k]=$("#nw-av-"+k)?.checked?"yes":"pending"; });
  if(!S.db) return err("The tracker isn't connected. Open it in claude.ai while signed in.");
  btn.disabled=true;
  try{ await createRec(kind,uniqueId(kind,name,source),rec0,"Added by hand"); closeModal(true); toast(`${name} added`); }
  catch(e){ btn.disabled=false; err("Couldn't save. Check your connection and edit access, then try again."); }
}

/* ---------- Excel parsing (shared by sync and agency import) ---------- */
function sheetRows(wb,name){ return XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:false,defval:"",blankrows:true}); }
function findCols(kind,rows){
  let hi=rows.findIndex(r=>r.some(c=>/model name|^name$|influencer/i.test(String(c).trim())));
  if(hi<0) hi=0;
  const h=(rows[hi]||[]).map(c=>String(c).replace(/ /g," ").trim().toLowerCase());
  const find=(re,from=0)=>{for(let i=from;i<h.length;i++) if(re.test(h[i])) return i; return -1;};
  const cols={};
  cols.serial=find(/^s\.? ?no|serial|^#$/);
  if(kind==="models"){
    cols.name=find(/model name|^name$/); cols.source=find(/agency|source/);
    cols.url=find(/url|instagram|link/); cols.nextAction=find(/remark/); cols.fee2025=find(/2025/); cols.proposal=find(/proposal|proposed|quote/);
    cols.feeNote=cols.proposal>=0?find(/remark/,cols.proposal+1):-1; cols.finalFee=find(/final/); cols.status=find(/^status/);
  } else {
    cols.name=find(/^name$|influencer|creator/); cols.source=find(/source|agency/); cols.url=find(/insta|url|link|handle/);
    cols.followers=find(/follower|reach/); cols.type=find(/^type|category|walk/); cols.proposal=find(/proposal|proposed|^fee|cost|commercial/);
    cols.finalFee=find(/final/); cols.status=find(/^status/); cols.nextAction=find(/remark/);
    if(cols.finalFee===cols.proposal) cols.finalFee=-1;
  }
  cols.avail=find(/^avail/); cols.meas=find(/^measurement/); cols.notes=find(/^notes?$/);
  cols.ankita=find(/^ankita approved/); cols.piyush=find(/^piyush approved/); cols.appId=find(/^app id$/);
  return {hi,cols};
}
function parseAvail(t){
  const s=String(t||"").toUpperCase().replace(/HEAD OFFICE|\bHO\b/g,"H").replace(/TAJ/g,"T").replace(/SHOW/g,"S").replace(/[^HTS]/g,"");

}
const parseMeas = t => /not/i.test(t)?"not_done":/done|yes|taken|✓/i.test(t)?"done":"not_done";
function mapStatusK(kind,raw){ const t=String(raw||"").trim().toLowerCase(); if(t){ const hit=statuses(kind).find(s=>s.label.toLowerCase()===t); if(hit) return hit.id; } return mapStatus(raw); }
function parseImport(kind,rows){
  const {hi,cols}=findCols(kind,rows);
  if(cols.name<0) return {error:"Couldn't find a Name column in this sheet. Check the header row."};
  const g=(r,k)=>cols[k]>=0?String(r[cols[k]]??"").replace(/ /g," ").trim():"";
  const out=[];
  rows.forEach((r,ri)=>{
    if(ri<=hi) return;
    const name=g(r,"name"); if(!name) return;
    const url=g(r,"url"); const note=g(r,"feeNote");
    let na=g(r,"nextAction"); na=na?na[0].toUpperCase()+na.slice(1).toLowerCase():"";
    const d={rowIdx:ri, name, source:normSource(kind,g(r,"source")), insta:/^https?:|instagram\.com/i.test(url)?(url.startsWith("http")?url:"https://"+url):(url.startsWith("@")?"https://www.instagram.com/"+url.slice(1):""),
      linkNote:/^tbd$/i.test(url)?"TBD":"", nextAction:na, proposal:parseNum(g(r,"proposal")), finalFee:parseNum(g(r,"finalFee")), status:mapStatusK(kind,g(r,"status")), statusRaw:g(r,"status"),
      serial:parseNum(g(r,"serial"))};
    if(kind==="models"){ d.fee2025=parseNum(g(r,"fee2025")); d.feeNote=note; d.counter=/^(ok|tbc)$/i.test(note)?null:parseNum(note); }
    else { d.followers=parseNum(g(r,"followers")); d.type=/attend|guest/i.test(g(r,"type"))?"attending":"walking"; }
    if(cols.avail>=0) d.avail=parseAvail(g(r,"avail"));
    if(cols.meas>=0) d.measStatus=parseMeas(g(r,"meas"));

/* A parsed sheet row → a new app record */
function recordFromParsed(kind,d){

const availFromLetters = s => ({ho:s.includes("H")?"yes":"pending", taj:s.includes("T")?"yes":"pending", show:s.includes("S")?"yes":"pending"});

/* ---------- Excel sync: field model ---------- */
const STATUS_XL={new:"",pending_piyush:"Piyush",waiting_agency:"Awaiting confirmation from agency",counter:"Counter proposal confirmation awaited",confirmed:"Confirmed",dropped:"Rejected"};
const statusToXl=(kind,id)=>id in STATUS_XL?STATUS_XL[id]:statusOf(kind,id).label;
const SYNC_FIELDS={

  influencers:[["serial","S No"],["name","Name"],["source","Source"],["insta","Instagram"],["followers","Followers"],["type","Type"],["nextAction","Remarks"],["proposal","Proposal"],["finalFee","Final fee"],["status","Status"],["avail","Availability"],["measStatus","Measurement"],["notes","Notes"]]};

function recVal(kind,r,f){

function keyOf(f,v){

function showVal(kind,f,v){

  if(f==="followers") return fmtF(v);

  if(f==="measStatus") return v==="done"?"Done":"Not done";

function cellVal(kind,f,r){
  switch(f){
    case "insta": return r.insta||(r.linkNote==="TBD"?"TBD":"");
    case "feeNote": return feeCellText(r);
    case "status": return statusToXl(kind,r.status);

function findSheet(wb,kind){
  return kind==="models" ? wb.SheetNames.find(n=>/models\s*2026/i.test(n)) : wb.SheetNames.find(n=>/influenc/i.test(n));
}
function matchRows(kind,rows,snap){
  const appKey=new Map(recs(kind).map(r=>[normKey(r.name)+"|"+normKey(r.source),r.id]));
  const snapKey=new Map(Object.entries(snap?.rows||{}).map(([id,v])=>[v._k,id]));
  const used=new Set();
  return rows.map(d=>{
    const key=normKey(d.name)+"|"+normKey(d.source); let id=null;
    if(d.appId&&rec(kind,d.appId)) id=d.appId; else if(snapKey.has(key)) id=snapKey.get(key); else if(appKey.has(key)) id=appKey.get(key);
    if(id&&used.has(id)) id="__dup"; else if(id) used.add(id);
    return {d,id,key};
  });

/* ---------- Excel → app (three-way merge against the last-sync snapshot) ---------- */
function buildSyncPlan(kind,wb,sheet,file){
  const parsed=parseImport(kind,sheetRows(wb,sheet));
  if(parsed.error) return {kind,sheet,error:parsed.error};
  const snap=S.sync[kind], fields=SYNC_FIELDS[kind].filter(([f])=>parsed.cols[colKey(f)]>=0);
  const p={kind,sheet,file,fields,updates:[],conflicts:[],add:[],missing:[],dups:[],same:0,snapRows:{},firstTime:!snap};
  const seen=new Set();
  for(const {d,id,key} of matchRows(kind,parsed.rows,snap)){
    if(id==="__dup"){ p.dups.push(d.name); continue; }
    const r=id&&rec(kind,id);
    const ekeys={}; fields.forEach(([f])=>ekeys[f]=keyOf(f,d[f]));
    if(id&&!r) continue;              // deleted in the app on purpose
    if(!r){ p.add.push({d,ekeys,key}); continue; }
    seen.add(id); p.snapRows[id]=Object.assign({_k:key},ekeys);
    const base=snap?.rows?.[id], ups=[], cons=[];
    for(const [f,label] of fields){
      const av=recVal(kind,r,f), ek=ekeys[f], ak=keyOf(f,av); if(ek===ak) continue;
      const item={f,label,app:showVal(kind,f,av),xl:showVal(kind,f,d[f]),val:d[f]};
      if(base&&f in base){ const bk=base[f]; if(ek===bk) continue; if(ak===bk) ups.push(item); else cons.push(Object.assign(item,{take:false})); }
      else if(ak==="") ups.push(item);
      else if(ek!=="") cons.push(Object.assign(item,{take:false}));
    }
    if(ups.length) p.updates.push({id,name:r.name,items:ups});
    if(cons.length) p.conflicts.push({id,name:r.name,items:cons});
    if(!ups.length&&!cons.length) p.same++;
  }
  if(snap?.rows) for(const id of Object.keys(snap.rows)){ const r=rec(kind,id); if(r&&!seen.has(id)&&bucketOf(kind,r)!=="out") p.missing.push({id,name:r.name,source:r.source,drop:false}); }
  return p;
}
function patchFromItems(items){
  const patch={};
  for(const it of items){
    const v=it.val;
    if(it.f==="avail") patch.avail=availFromLetters(v||"");
    else if(it.f==="feeNote"){ patch.feeNote=v||""; patch.counter=/^(ok|tbc)$/i.test(v||"")?null:parseNum(v); }
    else if(it.f==="insta"){ patch.insta=v||""; if(v) patch.linkNote=""; }
    else patch[it.f]=(v===undefined?null:v);
  }
  return patch;
}
const syncChangeCount = p => p.updates.reduce((a,u)=>a+u.items.length,0)+p.conflicts.reduce((a,c)=>a+c.items.filter(i=>i.take).length,0)+p.add.length+p.missing.filter(m=>m.drop).length;
async function applySync(){
  const s=S.syncIn; if(!s||!S.db) return;
  const total=s.plans.reduce((a,p)=>a+p.updates.length+p.conflicts.filter(c=>c.items.some(i=>i.take)).length+p.add.length+p.missing.filter(m=>m.drop).length,0);
  let n=0; const tick=()=>{ s.busy=`Saving ${++n} of ${total}…`; renderMain(true); };
  const done=[];
  try{
    for(const p of s.plans){
      if(p.error) continue;
      const kind=p.kind, snapRows=Object.assign({},p.snapRows);
      const lockOk=(id,it)=>{ if(it.f!=="status") return true; const r=rec(kind,id); if(r&&canSetStatus(r.status,it.val)) return true; s.skipped=(s.skipped||[]).concat(`${r?r.name:id}: ${it.app} → ${it.xl}`); return false; };
      p.updates.forEach(u=>u.items=u.items.filter(it=>lockOk(u.id,it))); p.conflicts.forEach(c=>c.items=c.items.filter(it=>!it.take||lockOk(c.id,it)));
      for(const u of p.updates){ if(!u.items.length) continue; await patchRec(kind,u.id,patchFromItems(u.items),"From Excel: "+u.items.map(i=>`${i.label} ${i.app} → ${i.xl}`).join("; ")); tick(); }
      for(const c of p.conflicts){ const take=c.items.filter(i=>i.take); if(!take.length) continue;
        await patchRec(kind,c.id,patchFromItems(take),"From Excel (chosen over app): "+take.map(i=>`${i.label} → ${i.xl}`).join("; ")); tick(); }
      for(const a of p.add){ const id=uniqueId(kind,a.d.name,a.d.source); await createRec(kind,id,recordFromParsed(kind,a.d),"Added from Excel ("+p.sheet+")"); snapRows[id]=Object.assign({_k:a.key},a.ekeys); tick(); }
      for(const m of p.missing){ if(m.drop){ await patchRec(kind,m.id,{status:"dropped",dropReason:"Removed from the Excel sheet"},"Missing from Excel → Dropped"); tick(); }
        if(S.sync[kind]?.rows?.[m.id]) snapRows[m.id]=S.sync[kind].rows[m.id]; }
      await queue("sync/"+kind,()=>S.db.doc("sync/"+kind).set({rows:snapRows,at:nowISO(),by:S.role,file:s.file,sheet:p.sheet}));
      done.push(`${KINDS[kind].label}: ${p.updates.reduce((a,u)=>a+u.items.length,0)} updates, ${p.conflicts.reduce((a,c)=>a+c.items.filter(i=>i.take).length,0)} conflicts taken from Excel, ${p.add.length} added`);
    }
    S.syncIn={done:"Sync finished. "+done.join(" · ")+"."+(s.skipped&&s.skipped.length?` Not applied, because only Piyush can move these on from his approval: ${s.skipped.join("; ")}.`:"")};
  }catch(e){ s.busy=`Stopped after ${n} of ${total}. Check your connection and edit access, then choose the file again. Changes already saved won't be repeated.`; }
  renderMain(true);
}

/* ---------- App → new Excel copy (master is only read, never written) ---------- */
function setCell(ws,R,C,v,isUrl){
  const addr=XLSX.utils.encode_cell({r:R,c:C});
  if(v==null||v===""){ if(ws[addr]) ws[addr]={t:"s",v:""}; return; }
  if(typeof v==="number") ws[addr]={t:"n",v};
  else { ws[addr]={t:"s",v:String(v)}; if(isUrl&&/^https?:/i.test(v)) ws[addr].l={Target:String(v)}; }
}
const apprText = a => a?((a.rejected?"Rejected ":"Approved ")+(a.at?fmtWhen(a.at):"(before app)")):"";
function patchSheet(kind,ws){
  const range=XLSX.utils.decode_range(ws["!ref"]||"A1");
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:"",blankrows:true});
  const parsed=parseImport(kind,rows);
  if(parsed.error) return {error:parsed.error};
  const {hi,cols}=parsed; let maxC=range.e.c, maxR=range.e.r; const added=[], fresh=new Set();
  const H=range.s.r+hi;
  let nextC=range.s.c+rows.reduce((m,r)=>{ for(let i=r.length-1;i>=0;i--) if(String(r[i]??"").trim()!=="") return Math.max(m,i); return m; },-1)+1;
  const ensure=(key,header)=>{ if(cols[key]>=0) return; cols[key]=nextC-range.s.c; setCell(ws,H,nextC,header); maxC=Math.max(maxC,nextC); nextC++; added.push(header); fresh.add(key); };
  ensure("avail","Availability (H/T/S)"); ensure("meas","Measurement"); ensure("notes","Notes");
  ensure("ankita","Ankita approved"); ensure("piyush","Piyush approved"); ensure("appId","App ID");
  const C=k=>range.s.c+cols[k];
  const fields=SYNC_FIELDS[kind].filter(([f])=>cols[colKey(f)]>=0);
  let cells=0; const changedRows=new Set(); const matched=new Set();
  const writeRow=(R,r,d)=>{
    for(const [f] of fields){
      const ak=keyOf(f,recVal(kind,r,f)), ek=d?keyOf(f,d[f]):"";
      if(d&&ak===ek) continue;
      if(!d&&ak==="") continue;
      setCell(ws,R,C(colKey(f)),cellVal(kind,f,r),f==="insta"); if(d&&!fresh.has(colKey(f))){ cells++; changedRows.add(r.id); }
    }
    setCell(ws,R,C("ankita"),apprText(r.approvals?.ankita)); setCell(ws,R,C("piyush"),apprText(r.approvals?.piyush)); setCell(ws,R,C("appId"),r.id);
  };
  for(const {d,id} of matchRows(kind,parsed.rows,S.sync[kind])){
    const r=id&&id!=="__dup"&&rec(kind,id); if(!r) continue;
    matched.add(r.id); writeRow(range.s.r+d.rowIdx,r,d);
  }
  const extra=recs(kind).filter(r=>!matched.has(r.id)).sort((a,b)=>(a.serial??9999)-(b.serial??9999)||String(a.name).localeCompare(b.name));
  for(const r of extra){ maxR++; writeRow(maxR,r,null); }
  ws["!ref"]=XLSX.utils.encode_range({s:range.s,e:{r:maxR,c:maxC}});
  return {cells,rows:changedRows.size,added:extra.length,newCols:added};
}
function newInfluencerSheet(){
  const head=["S No","Name","Source","Instagram","Type","Followers","Proposal","Remarks","Final Fee","Status","Availability (H/T/S)","Measurement","Notes","Ankita approved","Piyush approved","App ID"];
  const body=recs("influencers").slice().sort((a,b)=>String(a.name).localeCompare(b.name)).map((r,i)=>[r.serial??i+1,r.name,r.source,cellVal("influencers","insta",r),cellVal("influencers","type",r),r.followers??"",r.proposal??"",r.nextAction||"",r.finalFee??"",cellVal("influencers","status",r),cellVal("influencers","avail",r),cellVal("influencers","measStatus",r),r.notes||"",apprText(r.approvals?.ankita),apprText(r.approvals?.piyush),r.id]);
  return XLSX.utils.aoa_to_sheet([head,...body]);

function buildCopy(wb){

  const rd=new FileReader();
  rd.onload=()=>{ try{ cb(null,XLSX.read(new Uint8Array(rd.result),{type:"array",cellFormula:true})); }catch(e){ cb(e); } };
  rd.onerror=()=>cb(rd.error||new Error("read failed"));
  rd.readAsArrayBuffer(file);
}

/* ---------- Agency list import (adds new names, fills blanks; doesn't touch the sync snapshot) ---------- */
const IMP_FIELDS={models:[["insta","Instagram"],["fee2025","2025 fee"],["proposal","Proposed fee"],["feeNote","Fee remark"],["counter","Counter-offer"],["finalFee","Final fee"],["nextAction","Next action"],["status","Status"]],
  influencers:[["insta","Instagram"],["followers","Followers"],["type","Type"],["proposal","Proposed fee"],["finalFee","Final fee"],["nextAction","Next action"],["status","Status"]]};
function buildPlan(){
  const im=S.imp; im.plan=null; im.error="";
  const parsed=parseImport(im.kind,sheetRows(im.wb,im.sheet));
  if(parsed.error){ im.error=parsed.error; return; }
  const kind=im.kind, existing=new Map(recs(kind).map(r=>[normKey(r.name)+"|"+normKey(r.source),r]));
  const plan={cols:parsed.cols, add:[], fill:[], diff:[], same:0}, seen=new Set();
  for(const d of parsed.rows){
    const key=normKey(d.name)+"|"+normKey(d.source); if(seen.has(key)) continue; seen.add(key);
    const ex=existing.get(key);
    if(!ex){ const data=recordFromParsed(kind,d); data.origin="import"; plan.add.push({data}); continue; }
    const fill={}, diffs=[];
    for(const [k,label] of IMP_FIELDS[kind]){
      const sv=d[k], av=ex[k];
      const empty=v=>v==null||v==="";
      if(empty(sv)) continue;
      if(k==="status"){ if(sv!==av&&d.statusRaw) diffs.push({k,label,app:statusOf(kind,av).label,sheet:d.statusRaw,val:sv}); continue; }
      if(empty(av)) fill[k]=sv;
      else if(String(sv)!==String(av)) diffs.push({k,label,app:typeof av==="number"?inr(av):av,sheet:typeof sv==="number"?inr(sv):sv,val:sv});
    }
    if(Object.keys(fill).length) plan.fill.push({id:ex.id,name:ex.name,patch:fill});
    if(diffs.length) plan.diff.push({id:ex.id,name:ex.name,fields:diffs,take:false});
    if(!Object.keys(fill).length&&!diffs.length) plan.same++;
  }
  im.plan=plan;
}
async function applyImport(){
  const im=S.imp, p=im.plan, kind=im.kind; if(!p) return;
  let n=0; const total=p.add.length+p.fill.length+p.diff.filter(d=>d.take).length;
  const tick=()=>{ im.busy=`Saving ${++n} of ${total}…`; renderMain(true); };
  try{
    for(const a of p.add){ const id=uniqueId(kind,a.data.name,a.data.source); await createRec(kind,id,a.data,"Added from import ("+im.sheet+")"); tick(); }
    for(const f of p.fill){ await patchRec(kind,f.id,f.patch,"Filled from import: "+Object.keys(f.patch).join(", ")); tick(); }
    for(const d of p.diff.filter(d=>d.take)){ const patch={}; d.fields.forEach(f=>patch[f.k]=f.val); await patchRec(kind,d.id,patch,"Updated from import: "+d.fields.map(f=>f.label).join(", ")); tick(); }
    S.imp={done:`Import finished: ${p.add.length} added, ${p.fill.length} filled, ${p.diff.filter(d=>d.take).length} updated from the sheet.`};
  }catch(e){ im.busy="Stopped after "+n+" of "+total+". Fix the problem and apply again; finished rows won't be duplicated."; }
  renderMain(true);
}
async function exportXlsx(){
  const wb=XLSX.utils.book_new();
  const mk=kind=>recs(kind).slice().sort((a,b)=>(a.serial??9999)-(b.serial??9999)||String(a.name).localeCompare(b.name)).map((r,i)=>{
    const o={"S No":r.serial??i+1,"Name":r.name,[kind==="models"?"Agency":"Source"]:r.source,"Instagram":r.insta||r.linkNote||"","Status":statusOf(kind,r.status).label,"Next action":r.nextAction||""};
    if(kind==="models"){ o["2025 Fee"]=r.fee2025??""; }
    else { o["Type"]=r.type==="attending"?"Attending":"Walking"; o["Followers"]=r.followers??""; }
    Object.assign(o,{"Proposal":r.proposal??"","Fee remark":r.feeNote||"","Counter-offer":r.counter??"","Final Fee":r.finalFee??""});
    o["Availability (H/T/S)"]=cellVal(kind,"avail",r); o["Measurement"]=cellVal(kind,"measStatus",r);
    MEAS.forEach(([k,l])=>o[l]=r.meas?.[k]||"");
    o["Alteration"]=r.alteration||""; o["Ankita approved"]=apprText(r.approvals?.ankita); o["Piyush approved"]=apprText(r.approvals?.piyush); o["Notes"]=r.notes||""; return o; });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(mk("models")),"Models");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(mk("influencers").length?mk("influencers"):[{Name:""}]),"Influencers");
  const buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});
  try{ await S.downloads.save({filename:`Tasva LFW app data ${new Date().toISOString().slice(0,10)}.xlsx`,data:new Blob([buf])}); toast("Excel file saved"); }
  catch(e){ if(e&&e.code!=="declined") toast("Couldn't save the file: "+(e.message||e.code)); }
}

}

C.field=async el=>{
  const {kind,id}=S.drawer, r=rec(kind,id); if(!r) return;
  const path=el.dataset.path, type=el.dataset.type; let v=el.value.trim();
  if(type==="num"){ if(v===""){ v=null; } else { const n=parseNum(v); if(n==null) return toast(`"${v}" isn't a number. Try 18000 or 18k.`); v=n; } }
  if(path==="insta"&&v&&!/^https?:\/\//i.test(v)) v=v.startsWith("@")?"https://www.instagram.com/"+v.slice(1):"https://"+v;
  if(path==="name"&&!v) return toast("Name can't be empty");
  const parts=path.split("."), cur=parts.reduce((o,k)=>o==null?o:o[k],r);
  if((cur??null)===(v??null)||String(cur??"")===String(v??"")) return;
  const patch={}; let o=patch; parts.forEach((k,i)=>{ if(i===parts.length-1) o[k]=v; else o=o[k]={}; });
  if(path==="insta"&&v) patch.linkNote="";
  if(path.startsWith("meas.")&&path!=="meas.notes"&&v&&!measDone(r)) patch.measStatus="done";
  const show=type==="num"&&v!=null?(path==="followers"?fmtF(v):inr(v)):(v==null||v===""?"cleared":`"${String(v).slice(0,60)}"`);
  await patchRec(kind,id,patch,`${el.dataset.label}: ${show}`).catch(()=>{});
};

C["imp-kind"]=el=>{ S.imp.kind=el.value; buildPlan(); renderMain(true); };
C["imp-diff"]=el=>{ S.imp.plan.diff[+el.dataset.i].take=el.checked; renderMain(true); };

document.addEventListener("click",e=>{
  const t=e.target.closest("#tabs [data-tab]"); if(t){ go(t.dataset.tab); return; }
  const a=e.target.closest("[data-action]"); if(a&&A[a.dataset.action]&&!a.disabled){ if(a.tagName==="A") return; if(a.dataset.action!=="modal-scrim") e.preventDefault(); A[a.dataset.action](a,e); }
});
document.addEventListener("change",e=>{ const el=e.target.closest("[data-change]"); if(el&&C[el.dataset.change]) C[el.dataset.change](el,e); });
let qT; document.addEventListener("input",e=>{ const el=e.target; if(el.dataset&&el.dataset.input==="q"){ S.f[el.dataset.kind].q=el.value; clearTimeout(qT); qT=setTimeout(()=>{ const b=$("#body"); if(b){ b.innerHTML=BODIES[S.tab](); } },120); } });
document.addEventListener("keydown",e=>{ if(e.key!=="Escape") return; if(popFor) return closePop(); if($("#modal-root").innerHTML) return closeModal(false); if(S.drawer) closeDrawer(); });
document.addEventListener("pointerdown",e=>{ if(popFor&&!e.target.closest("#pop")&&!e.target.closest('[data-action="avail-open"]')) closePop(); });
window.addEventListener("scroll",e=>{ if(popFor&&!(e.target&&e.target.closest&&e.target.closest("#pop"))) closePop(); },true);
window.addEventListener("resize",()=>{ if(popFor) closePop(); });
/* ---------- Boot ---------- */
function mergeConfig(stored){
  const c=clone(DEFAULT_CONFIG);
  if(!stored) return c;
  for(const k of Object.keys(c)){ if(stored[k]==null) continue;
    if(typeof c[k]==="object"&&!Array.isArray(c[k])) for(const j of Object.keys(c[k])){ if(stored[k][j]!=null) c[k][j]=stored[k][j]; }
    else c[k]=stored[k]; }
  if(stored.targets&&stored.targets.models==null) c.targets.models=80;
  delete c.targets.modelsMin; delete c.targets.modelsMax;
  for(const kind of ["models","influencers"]) for(const id of SYS) if(!c.statuses[kind].some(s=>s.id===id)) c.statuses[kind].push(baseStatuses().find(s=>s.id===id));
  return c;
}
function initTab(){ const h=(location.hash||"").slice(1); if(TABS.some(t=>t[0]===h)) S.tab=h; }

async function resolveRole(){
  S.role="guest"; S.roles=null;
  const u=S.authUser; if(!u||!S.db) return;
  try{
    const snap=await S.db.doc("roles/main").get(); let r=snap.exists?snap.data():{};
    if(!r.ankita){ try{ const next=Object.assign({},r,{ankita:u.email}); await S.db.doc("roles/main").set(next); r=next; }catch(e){ /* only Ankita's email is allowed to claim the owner seat */ } }
    S.roles=r;
    if(r.ankita&&r.ankita.toLowerCase()===u.email) S.role="ankita";
    else if(r.piyush&&r.piyush.toLowerCase()===u.email) S.role="piyush";
  }catch(e){ console.warn("roles",e); }
}
async function boot(){
  initTab(); renderTabs(); renderCountdown(); renderMe(); setInterval(renderCountdown,60000);
  const fb=await window.__fbReady;
  if(!fb||fb.setup||fb.error){ S.ready=true; S.bootMsg=fb&&fb.setup?"setup":"error"; S.bootErr=fb&&fb.error||""; $("#boot")?.remove(); renderMain(true); return; }
  S.db=fb.db; S.auth=fb.auth; S.downloads={save:saveFile};
  const db=fb.db;
  let firstAuth=true;
  fb.auth.onChange(async u=>{
    S.authUser=u; await resolveRole(); renderMe();
    if(u&&S.role==="guest"&&!firstAuth) toast(`${u.email} has view-only access. Ask Ankita to add you in Settings.`);
    if(u&&S.role!=="guest"&&!firstAuth) toast(`Signed in as ${PEOPLE[S.role].name}`);
    firstAuth=false;
    if(!visibleTabs().some(t=>t[0]===S.tab)) S.tab="dashboard";
    renderTabs(); if(S.ready) renderMain(true); renderDrawer(true);
  });
  const onErr=e=>{ console.warn(e); };
  const mark=()=>{ if(!S.ready&&S.loaded.models&&S.loaded.config){ S.ready=true; $("#boot")?.remove(); renderTabs(); renderMain(true); } else scheduleRender(); };
  db.collection("models").onSnapshot(s=>{ S.models=s.docs.map(d=>Object.assign({id:d.id},d.data())); S.loaded.models=true; mark(); },onErr);
  db.collection("influencers").onSnapshot(s=>{ S.influencers=s.docs.map(d=>Object.assign({id:d.id},d.data())); S.loaded.influencers=true; mark(); },onErr);
  db.doc("config/main").onSnapshot(s=>{ S.configExists=s.exists; S.config=mergeConfig(s.exists?s.data():null); S.loaded.config=true; mark(); },e=>{ onErr(e); S.loaded.config=true; mark(); });
  db.collection("sync").onSnapshot(s=>{ S.sync={models:null,influencers:null}; s.docs.forEach(d=>{ S.sync[d.id]=d.data(); }); scheduleRender(); },onErr);
  db.collection("activity").orderBy("at","desc").limit(400).onSnapshot(s=>{ S.activity=s.docs.map(d=>d.data()); scheduleRender(); },onErr);
  let wasPhone=isPhone(); window.addEventListener("resize",()=>{ const p=isPhone(); if(p!==wasPhone){ wasPhone=p; renderTabs(); renderMain(true); } });
  setTimeout(()=>{ if(!S.ready){ S.ready=true; renderMain(true); } },10000);
}
boot();
</script>
